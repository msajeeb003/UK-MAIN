# Fly.io — backend in London (lhr). Deploy from the repository root:
#
#   fly launch --no-deploy --copy-config --config deploy/fly.toml --name quote-tool-backend
#   fly volumes create quote_data --region lhr --size 10 --app quote-tool-backend
#   fly secrets set --app quote-tool-backend $(grep -v '^#' deploy/.env.production | xargs)
#   fly deploy --config deploy/fly.toml --dockerfile Dockerfile
#
# The machine keeps running (no auto-stop) because extractions run on
# background threads after the HTTP request has returned.

app = "quote-tool-backend"
primary_region = "lhr"

[build]
  dockerfile = "../Dockerfile"

[env]
  APP_ENV = "production"
  COOKIE_SECURE = "true"
  DATA_DIR = "/data"
  FORWARDED_ALLOW_IPS = "*"
  WORKERS = "2"
  PORT = "8000"

[[mounts]]
  source = "quote_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
  cpu_kind = "shared"
