# Build the backend and web images and push them to GitHub Container
# Registry on every push to main and on version tags, so a host can pull a
# tested image instead of building from source (Fly/Railway can also deploy
# from these). Optionally deploys to Fly.io when FLY_API_TOKEN is set.

name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: Dockerfile
          - name: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/uk-main-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public-by-design values baked into the web bundle.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  fly:
    # Deploys the backend to Fly.io (London) when the repository has a
    # FLY_API_TOKEN secret; skipped otherwise.
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --config deploy/fly.toml --dockerfile Dockerfile
