# Alembic configuration for the relational project store (PostgreSQL in
# production, SQLite in development). Run from any directory:
#
#   python -m alembic -c backend/alembic.ini upgrade head     # apply
#   python -m alembic -c backend/alembic.ini current          # what is applied
#   python -m alembic -c backend/alembic.ini downgrade -1     # step back
#
# The database URL comes from the app settings (DATABASE_URL, .env) unless
# `sqlalchemy.url` is set here or passed with `-x url=...`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
